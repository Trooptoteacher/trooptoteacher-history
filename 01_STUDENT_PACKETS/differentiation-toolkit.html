<div class="org"><div class="org-hdr">Boxed Notes Template (Standard)<span style="font-size:8pt;background:#C9A227;color:#3D2200;border-radius:2px;padding:1px 7px">Organizer</span></div><div style="padding:10px 14px">



<hr>



<p><strong>Student Instructions:</strong></p>
<ol>
<li>Each box holds one type of information — read the label before you write.</li>
<li>Be concise: the goal is key ideas, not full sentences copied from the text.</li>
<li>The "My Takeaway" box is always your own thinking — not something you can find in the source.</li>
<li>After completing all boxes, use them to write a full paragraph argument.</li>
</ol>


<p><strong>Why boxes work:</strong> Spatial boundaries force the brain to categorize information as it is recorded. Students who struggle with linear notes often perform significantly better when the structure imposes the categorization for them — a finding documented consistently in research on visual organization strategies.</p>



<hr>




<div class="org-container" aria-label="Boxed Notes Organizer">
  <div class="org-heading">
    <span class="org-label">Boxed Notes</span>
    <span class="org-sublabel">Standard Template</span>
  </div>
  <div class="box-grid">
    <div class="box-cell top-left">
      <span class="box-cell-label">MAIN IDEA</span>
      <span class="box-cell-hint">(1–2 sentences: what is this section, source, or event about?)</span>
      <span class="wl"></span><span class="wl"></span><span class="wl"></span>
      <span class="wl"></span><span class="wl"></span>
    </div>
    <div class="box-cell top-right">
      <span class="box-cell-label">KEY EVIDENCE</span>
      <span class="box-cell-hint">(Specific facts, dates, quotes — cite your source in parentheses)</span>
      <span class="wl numbered">1.</span>
      <span class="wl numbered">2.</span>
      <span class="wl numbered">3.</span>
      <span class="wl"></span>
    </div>
    <div class="box-cell bottom-left">
      <span class="box-cell-label">COUNTERPOINT / COMPLICATION</span>
      <span class="box-cell-hint">(What could someone argue against the main idea? What does the evidence NOT show?)</span>
      <span class="wl"></span><span class="wl"></span><span class="wl"></span>
      <span class="wl"></span><span class="wl"></span>
    </div>
    <div class="box-cell bottom-right">
      <span class="box-cell-label">MY TAKEAWAY</span>
      <span class="box-cell-hint">(What does this mean? Why does it matter? What question does it raise?)</span>
      <span class="wl"></span><span class="wl"></span><span class="wl"></span>
      <span class="wl"></span><span class="wl"></span>
    </div>
    <div class="box-full-row">
      <span class="box-cell-label">CONNECTION TO ESSENTIAL QUESTION:</span>
      <span class="box-cell-hint">This evidence [supports / complicates / challenges] the argument that</span>
      <span class="fill-line connection-line"></span>
      <span class="fill-line connection-line"></span>
    </div>
  </div>
</div>




<p><strong>Teacher Tip:</strong> The boxing method works best when the box labels stay consistent across units — students build automaticity with the categories. Reserve changes to box labels only for specialized tasks (argument writing, primary source analysis). Research on spatial note-taking methods suggests the organizational benefit comes partly from the repeated categorization routine, so consistency matters.</p>



<hr>



</div></div>

<ol>

<p><strong>When to fade this scaffold:</strong> Once students are consistently filling all four standard boxes without the prompts (typically after 2–3 uses), transition them to the standard Boxed Notes template.</p>

<ol>
<li>Fill in the event, date, and one-sentence description for each box.</li>

<div class="org"><div class="org-hdr">Multiple Causation / Cause-Effect Organizer<span style="font-size:8pt;background:#C9A227;color:#3D2200;border-radius:2px;padding:1px 7px">Organizer</span></div><div style="padding:10px 14px">



<hr>



<p><strong>Student Instructions:</strong></p>
<ol>
<li>Write the historical event or outcome in the center box.</li>
<li>Fill in at least THREE causes — one in each branch.</li>
<li>Label each cause as: P (Political), E (Economic), S (Social), or I (Ideological).</li>
<li>In the bottom section, explain which cause was most significant and why.</li>
<li>This is a CAUSATION [skill] task — your job is to rank and evaluate causes, not just list them.</li>
</ol>


<p><strong>Teacher Note:</strong> A common student misconception is that listing causes is the same as analyzing them. The significance ranking at the bottom of this organizer is deliberately designed to force the evaluative move. Research on history-specific organizers confirms that multiple-causation tasks produce deeper historical thinking when students must weigh causes against each other, not just enumerate them. This organizer also works well for SSP.03 (synthesize data) by requiring students to pull causes from multiple sources.</p>



<hr>

  </div>

    <span class="meta-field">Name: <span class="fill-line meta-line"></span></span>
    <span class="meta-field">Unit: <span class="fill-line meta-line-sm"></span></span>

<h2 id="phase-4---how-to-use-guides">PHASE 4 — How to Use Guides</h2>



<hr>



<h3>Cornell Notes — Quick Start Guides</h3>



<p><strong>Teacher Quick Start:</strong></p>
<ul>
<li><strong>Before reading:</strong> Distribute the template; write the essential question with the class on the board; model what goes in the Notes column vs. what goes in the Cue column with one example.</li>
<li><strong>During/after reading:</strong> Give students 5 minutes of in-class time to write cue questions — do not assign this as homework for the first several uses. Students who do not understand the difference between notes and questions will reveal it here, where you can redirect them.</li>
<li><strong>Removing the scaffold:</strong> Start by removing the sentence starter from the Summary section; then, once cue questions are fluent, move students to blank Cornell format. The two-column visual layout can remain even after all pre-filling is removed.</li>
<li><strong>Modeling tip:</strong> Project your own partially completed Cornell Notes and think aloud as you decide whether something belongs in the Notes vs. Cue column. The most important thing to model is that cue questions are generated <em>after</em> reading — not written in advance.</li>
</ul>


<p><strong>Student Quick Start:</strong></p>
<ul>
<li>Take notes on the RIGHT side during reading or listening. Write key ideas in your own words — not full sentences copied from the text.</li>
<li>After you finish reading, look at each section of notes and write ONE question on the LEFT side that your notes answer.</li>
<li>Cover the right side. Use your questions to test yourself. If you cannot answer a question, go back and re-read.</li>
<li>Write your summary in the bottom box — 2–3 sentences, no looking at your notes.</li>
<li>The organizer is a thinking tool. The summary paragraph or essay you write later is the final product.</li>
</ul>


<hr>



<h3>Boxed Notes — Quick Start Guides</h3>



<p><strong>Teacher Quick Start:</strong></p>
<ul>
<li><strong>Before reading:</strong> Review the four box labels with students. Clarify the difference between "Key Evidence" (specific, sourced) and "My Takeaway" (your original thinking). This is the most common source of confusion.</li>
<li><strong>During reading:</strong> Instruct students to fill boxes roughly in order (Main Idea → Key Evidence → Counterpoint → Takeaway) to avoid the common habit of writing only in the Main Idea box.</li>
<li><strong>Removing the scaffold:</strong> Start by removing the prompts from the scaffolded version; then progress to blank boxes with labels only; finally let students draw their own boxes once they have internalized the four categories.</li>
<li><strong>Modeling tip:</strong> Demonstrate filling in one full row of boxes from a short paragraph and explicitly say "I'm putting this in Key Evidence, not Main Idea, because it's a specific fact, not an overall claim."</li>
</ul>


<p><strong>Student Quick Start:</strong></p>
<ul>
<li>Each box holds a different TYPE of information — read the label before you write in it.</li>
<li>"Main Idea" = the overall point. "Key Evidence" = specific facts, with sources in parentheses.</li>
<li>"Counterpoint" = the strongest argument against the main idea, or what the evidence can't prove.</li>
<li>"My Takeaway" = your own thinking. No prompts can answer this box — it requires your judgment.</li>
<li>Use your completed boxes to build a paragraph or essay. The boxes are notes, not the final answer.</li>
</ul>


<hr>



<h3>Timeline — Quick Start Guides</h3>



<p><strong>Teacher Quick Start:</strong></p>
<ul>
<li><strong>Before reading:</strong> Draw the timeline on the board with blank event boxes. Ask students to predict which events will be most significant before filling anything in — this activates prior knowledge and creates a purpose for reading.</li>
<li><strong>During reading:</strong> Students fill event boxes as they read. Reserve the Cause/Effect rows for class discussion rather than independent work for the first use, so you can model the distinction between "what caused this" and "what came before this."</li>
<li><strong>Removing the scaffold:</strong> Start by removing the Cause/Effect rows and asking students to identify which events deserve them without guidance; then move to blank chronological paper where students decide the structure themselves.</li>
<li><strong>Using it for CCOT:</strong> After completing the timeline, ask: "Pick the single most significant turning point. What changed after it? What did NOT change?" This converts the chronology organizer into a CCOT analytical tool.</li>
</ul>


<p><strong>Student Quick Start:</strong></p>
<ul>
<li>Fill in events in chronological order — earliest on the left, most recent on the right.</li>
<li>For starred (★) events: you must also fill in at least one Cause and one Effect.</li>
<li>The reflection question at the bottom is the most important part — a timeline that doesn't lead to analysis is just a list of dates.</li>
<li>After completing the timeline, use it to answer: What changed over this period? What stayed the same?</li>
</ul>


<hr>



<h3>Cause-Effect / Multiple Causation — Quick Start Guides</h3>



<p><strong>Teacher Quick Start:</strong></p>
<ul>
<li><strong>Before reading:</strong> Write the event/outcome in the center box; leave the cause branches blank. Ask students: "Before we read, what causes do you already predict?" This identifies misconceptions early.</li>
<li><strong>During reading:</strong> Students add causes as they encounter them. Require the P/E/S/I label for every cause — this forces categorization, which is a key move in mature causal reasoning.</li>
<li><strong>Removing the scaffold:</strong> Start by removing the type labels; then remove the significance ranking prompts; finally move to blank paper where students design their own causal diagram.</li>
<li><strong>Connecting to argument writing:</strong> The significance ranking at the bottom is the exact analytical move required for a DBQ thesis. Use this explicitly: "Your significance ranking is your thesis. The evidence for it is your body paragraph."</li>
</ul>


<p><strong>Student Quick Start:</strong></p>
<ul>
<li>Write the event or outcome in the center box FIRST.</li>
<li>Add at least THREE causes — one per branch. Label each P (Political), E (Economic), S (Social), or I (Ideological).</li>
<li>The significance ranking at the bottom is not optional — you must argue for why one cause was more important than the others.</li>
<li>This is a [CAUSATION] task. Listing causes earns partial credit. Explaining which was most significant and why earns full credit.</li>
</ul>


<hr>

<h3>Decision Guide for Teachers</h3>



<p><strong>Use it every unit:</strong></p>
<ul>
<li>Cornell Notes (or Scaffolded Cornell) — standard note-taking routine; fades as students build fluency.</li>
<li>Timeline — any unit where chronological sequence is analytically important (Units 1, 4, 6, 7, 8).</li>
<li>Boxed Notes (standard or scaffolded) — any primary source or document-heavy lesson.</li>
</ul>


<p><strong>Use it selectively when students are struggling with X:</strong></p>
<ul>
<li>Students can't separate claim from evidence → Scaffolded Boxed Notes</li>
<li>Students list causes but don't evaluate them → Multiple Causation Organizer with significance ranking required</li>
<li>Students write long notes but can't recall later → Cornell Notes; enforce the cue-question and self-testing steps</li>
<li>ELL students are producing minimal output → Scaffolded Cornell with sentence starters; Frayer Model for key vocabulary</li>
<li>Students complete SOAPS but can't make argumentative connection → SOAPS+HIPP Table; model the "Because [HIPP feature], this source is useful for arguing..." sentence explicitly</li>
</ul>


<p><strong>The fade principle:</strong> Every scaffold in this toolkit should have a planned removal date. Write it on your pacing guide: "Remove sentence starters from Cornell by Unit 4." "Move to standard Boxed Notes by Unit 6." Students who use the same scaffolded organizer for an entire year have not been taught — they have been accommodated. The goal is always independence.</p>
