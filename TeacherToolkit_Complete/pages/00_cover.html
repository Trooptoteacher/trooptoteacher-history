<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Teacher Graphic Organizer Toolkit — Complete Series</title>
<style>
  :root{ --navy:#1B2A4A; --red:#B22234; --gold:#C89B3C; --paper:#ffffff; }
  *{box-sizing:border-box; margin:0; padding:0;}
  @page{ size:8.5in 11in; margin:0; }
  html,body{ background:var(--navy); }
  body{ font-family:"Helvetica Neue",Arial,sans-serif; }
  .page{ position:relative; width:8.5in; height:11in; background:var(--navy);
         overflow:hidden; display:flex; flex-direction:column; }
  /* subtle radial glow + hairline frame */
  .glow{ position:absolute; inset:0; background:
         radial-gradient(120% 80% at 50% 22%, rgba(200,155,60,0.16), rgba(27,42,74,0) 60%); }
  .frame{ position:absolute; inset:0.42in; border:1.5px solid rgba(200,155,60,0.55); }
  .frame::before{ content:""; position:absolute; inset:5px; border:0.75px solid rgba(200,155,60,0.30); }
  .inner{ position:relative; flex:1 1 auto; display:flex; flex-direction:column;
          align-items:center; text-align:center; padding:1.15in 0.9in 0.9in; }
  .brandline{ color:var(--gold); font-size:10pt; font-weight:800; letter-spacing:.30em;
              text-transform:uppercase; }
  .brandline .tm{ font-size:6pt; vertical-align:super; letter-spacing:0; }
  .emblem{ margin:0.42in 0 0.30in; }
  .emblem svg{ display:block; }
  h1{ font-family:Georgia,"Times New Roman",serif; color:#fff; font-weight:700;
      font-size:41pt; line-height:1.04; letter-spacing:.005em; }
  h1 .g{ color:var(--gold); }
  .rule{ width:2.1in; height:2.4px; background:var(--gold); margin:0.30in 0; border-radius:2px; position:relative; }
  .rule::before,.rule::after{ content:"\2726"; position:absolute; top:50%; transform:translateY(-50%);
      color:var(--gold); font-size:11pt; }
  .rule::before{ left:-26px; } .rule::after{ right:-26px; }
  .series{ color:#eaeef6; font-family:Georgia,serif; font-style:italic; font-size:16.5pt; letter-spacing:.01em; }
  .scope{ margin-top:16px; color:#c7d0df; font-size:11.5pt; font-weight:600; letter-spacing:.02em; line-height:1.7; }
  .scope b{ color:#fff; }
  /* organizer-motif strip */
  .motifs{ margin-top:auto; display:flex; gap:26px; align-items:flex-end; justify-content:center;
           opacity:.85; padding-bottom:6px; }
  .motifs svg{ display:block; }
  .mlabel{ margin-top:9px; color:var(--gold); font-size:8pt; font-weight:800; letter-spacing:.22em;
           text-transform:uppercase; }
  .footer{ position:relative; flex:0 0 auto; text-align:center; padding:0 0 0.62in; }
  .repro{ display:inline-block; border:1.4px solid var(--gold); color:var(--gold);
          font-size:8.5pt; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
          padding:6px 16px; border-radius:14px; }
  .edition{ margin-top:14px; color:#9fabc0; font-size:9.5pt; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
</style></head>
<body>
  <div class="page">
    <div class="glow"></div>
    <div class="frame"></div>
    <div class="inner">
      <div class="brandline">TroopToTeacher Technologies &nbsp;&middot;&nbsp; U.S. History Hack<span class="tm">&trade;</span></div>

      <div class="emblem">
        <svg width="118" height="118" viewBox="0 0 118 118" fill="none">
          <circle cx="59" cy="59" r="57" stroke="#C89B3C" stroke-width="2"/>
          <circle cx="59" cy="59" r="45" stroke="#C89B3C" stroke-width="1" opacity="0.5"/>
          <circle cx="48" cy="59" r="24" stroke="#ffffff" stroke-width="2" opacity="0.92"/>
          <circle cx="70" cy="59" r="24" stroke="#C89B3C" stroke-width="2"/>
          <text x="59" y="35" text-anchor="middle" fill="#C89B3C" font-family="Georgia,serif" font-size="15" font-weight="700">&#9733;</text>
        </svg>
      </div>

      <h1>Teacher Graphic<br/><span class="g">Organizer</span> Toolkit</h1>
      <div class="rule"></div>
      <div class="series">The Complete Series</div>
      <div class="scope">
        Tennessee U.S. History &nbsp;&middot;&nbsp; High School<br/>
        <b>Units 1&ndash;10</b> &nbsp;&middot;&nbsp; Standards <b>US.01&ndash;US.95</b>
      </div>

      <div class="motifs">
        <!-- Venn -->
        <svg width="52" height="34" viewBox="0 0 52 34"><circle cx="20" cy="17" r="14" stroke="#ffffff" stroke-width="1.6" opacity=".85"/><circle cx="32" cy="17" r="14" stroke="#C89B3C" stroke-width="1.6"/></svg>
        <!-- Matrix -->
        <svg width="40" height="34" viewBox="0 0 40 34"><g stroke="#C89B3C" stroke-width="1.5"><rect x="4" y="5" width="32" height="24"/><line x1="4" y1="13" x2="36" y2="13"/><line x1="4" y1="21" x2="36" y2="21"/><line x1="15" y1="5" x2="15" y2="29"/><line x1="26" y1="5" x2="26" y2="29"/></g></svg>
        <!-- Timeline -->
        <svg width="52" height="34" viewBox="0 0 52 34"><line x1="5" y1="17" x2="47" y2="17" stroke="#C89B3C" stroke-width="1.5"/><circle cx="10" cy="17" r="4" fill="#C89B3C"/><circle cx="26" cy="17" r="4" fill="#ffffff"/><circle cx="42" cy="17" r="4" fill="#C89B3C"/></svg>
        <!-- Concept web -->
        <svg width="44" height="34" viewBox="0 0 44 34"><g stroke="#ffffff" stroke-width="1.3" opacity=".8"><line x1="22" y1="17" x2="8" y2="6"/><line x1="22" y1="17" x2="36" y2="6"/><line x1="22" y1="17" x2="8" y2="28"/><line x1="22" y1="17" x2="36" y2="28"/></g><circle cx="22" cy="17" r="6" fill="#C89B3C"/><g fill="#ffffff"><circle cx="8" cy="6" r="3"/><circle cx="36" cy="6" r="3"/><circle cx="8" cy="28" r="3"/><circle cx="36" cy="28" r="3"/></g></svg>
      </div>
      <div class="mlabel">Best&#8209;Fit Organizers &nbsp;&middot;&nbsp; Blank Reproducibles &nbsp;&middot;&nbsp; UDL Supports</div>
    </div>
    <div class="footer">
      <span class="repro">Reproducible Classroom Masters</span>
      <div class="edition">2026 Edition</div>
    </div>
  </div>
</body></html>
